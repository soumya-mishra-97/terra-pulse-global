[project]
name = "terrapulse-backend"
version = "0.1.0"
description = "TerraPulse Global AI - population estimation and demographic intelligence API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-anthropic>=0.3",
    "reportlab>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "pypdf>=4.3",
    "ruff>=0.6",
]
s3 = ["boto3>=1.34"]

[project.scripts]
terrapulse = "app.ingestion.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 125
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["B008", "S101", "S311", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]
"migrations/*" = ["E501"]
