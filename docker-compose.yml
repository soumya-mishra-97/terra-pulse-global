# TerraPulse Global AI - local stack: PostgreSQL + FastAPI (modular monolith) + React (nginx).
# Usage: cp .env.example .env && docker compose up --build   ->  http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: terrapulse
      POSTGRES_USER: terrapulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terrapulse -d terrapulse"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://terrapulse:${POSTGRES_PASSWORD}@db:5432/terrapulse
      STORAGE_DIR: /srv/backend/var/reports
      CORS_ORIGINS: '["http://localhost:8080"]'
    volumes:
      - reports:/srv/backend/var/reports
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  pgdata:
  reports:
